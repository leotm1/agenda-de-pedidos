name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Gerar ícones
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2445C2' --iconBackgroundColorDark '#2445C2' --splashBackgroundColor '#2445C2' --splashBackgroundColorDark '#0D121D'

      - name: Permissões de notificação e ícone da notificação
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          mkdir -p android/app/src/main/res/drawable
          cp native/ic_stat_pedido.xml android/app/src/main/res/drawable/
          npx cap sync android
          cat "$M"

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AgendaDePedidos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaDePedidos-apk
          path: AgendaDePedidos.apk

      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agenda de Pedidos (versão ${{ github.run_number }})
          body: Baixe o arquivo AgendaDePedidos.apk no celular Android e toque nele para instalar.
          files: AgendaDePedidos.apk
          make_latest: true
